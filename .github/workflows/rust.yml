name: Rust check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('engine/Cargo.lock') }}

      - name: Build
        run: cargo build --manifest-path engine/Cargo.toml

      - name: Run tests
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Build WASM target
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack build --target web --out-dir pkg/engine engine/
