[package]
name = "engine2048"
version = "0.1.0"
edition = "2026"

[dependencies]
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[[bin]]
name = "demo"
path = "src/main.rs"
